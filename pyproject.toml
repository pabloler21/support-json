[project]
name = "support-json"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Without this, pytest prepends `tests/` to sys.path instead of the project
# root, and `from src.json_validator import ...` fails inside test_core.py.
pythonpath = ["."]
testpaths = ["tests"]
